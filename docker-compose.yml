services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trailsense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trailsense}
      POSTGRES_DB: ${POSTGRES_DB:-trailsense}
    ports:
      - "5432:5432"
    volumes:
      - trailsense_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trailsense}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trailsense_db_data:
